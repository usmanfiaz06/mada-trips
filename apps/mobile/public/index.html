    <title>%WEB_TITLE%</title>
    <!-- react-native-web's reset (https://necolas.github.io/react-native-web/docs/setup/#root-element). -->
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; background: #e9e2d8; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
    <!--
      The first thing on screen, before any script has arrived (docs/app/PERF.md): the sun on the brand green, drawn by
      the page itself in the first few kilobytes. The app removes it when its first screen is ready (src/app/_layout.tsx).
    -->
    <style>
      #mada-boot { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: #1e352d; }
      #mada-boot svg { width: 96px; height: 64px; fill: #d9b77a; }
      #mada-boot i { display: block; width: 120px; height: 2px; border-radius: 1px; background: rgba(217, 183, 122, 0.22); overflow: hidden; }
      #mada-boot i::after { content: ""; display: block; width: 40%; height: 100%; background: #d9b77a; animation: mada-boot 1.4s ease-in-out infinite; }
      @keyframes mada-boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #mada-boot i::after { animation: none; width: 100%; opacity: 0.5; } }
    </style>
  </head>
