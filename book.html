  <main class="home">
    <section class="ask">
      <div class="ask__main">
        <p class="ask__greet"><span id="greet">Good evening</span></p>
        <h1 class="ask__title" data-t="ask">Where to next?</h1>
        <p class="ask__sub" data-t="sub">Type it the way you'd say it. We'll work out the rest.</p>

        <div class="box">
          <button type="button" class="box__from" id="fromBtn" title="Change where you fly from">
            <span data-t="from">From</span> <b id="fromCity">Riyadh</b> <u data-t="change">change</u>
          </button>
          <label class="sr" for="q">Describe your trip</label>
          <div class="box__field">
            <svg class="box__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c.6 4.4 2.6 6.4 7 7-4.4.6-6.4 2.6-7 7-.6-4.4-2.6-6.4-7-7 4.4-.6 6.4-2.6 7-7z"/></svg>
            <textarea id="q" rows="1" autocomplete="off" spellcheck="false" enterkeyhint="go"></textarea>
          </div>
          <div class="und" id="und" aria-live="polite"></div>
        </div>
        <div class="ex" id="ex"></div>

        <div class="resume" id="resume" hidden>
          <span data-t="resume">Pick up where you left off</span>
          <button type="button" id="resumeBtn">“<span id="resumeText"></span>” →</button>
        </div>
      </div>

      <aside class="tk" id="ticket" aria-live="polite"></aside>
    </section>

    <section class="cards-wrap">
