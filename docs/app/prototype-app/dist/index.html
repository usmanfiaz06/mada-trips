<meta charset="utf-8">
<title>Mada Trips app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>/* Mada Trips prototype. Layout: a phone (390x844) beside a demo panel on wide screens; the app fills the screen on a phone. */
:root {
  --sand: #e9e2d8;      /* canvas */
  --paper: #fffdf9;     /* cards */
  --mist: #f6f2ec;      /* chips, inner wells */
  --green: #1e352d;     /* ink and focal surfaces */
  --green-2: #2a4a40;
  --green-3: #142720;
  --ink-2: #4d5c55;     /* secondary text */
  --ink-3: #5f6b65;     /* tertiary text, still 4.5:1 on sand */
  --gold: #d9b77a;      /* the one accent: the thing to do now */
  --gold-deep: #b98f4a;
  --gold-ink: #7d5d27;  /* gold as text */
  --ok: #2f7a4b;
  --ok-bright: #3f9a63;
  --line: rgba(30, 53, 45, .1);
  --shade: rgba(15, 26, 22, .55);
  --stage: #d6cdbf;
  --f-ui: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.2, .9, .25, 1.2);
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--stage); color: var(--green); font-family: var(--f-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }

/* ---------- stage ---------- */
.stage { min-height: 100%; display: flex; align-items: flex-start; justify-content: center; gap: 32px; padding: 32px 16px; box-sizing: border-box; flex-wrap: wrap; }
.phone { position: relative; width: 390px; height: 844px; border-radius: 54px; background: var(--sand); overflow: hidden; box-shadow: 0 0 0 10px #10160f, 0 0 0 11px #3a443d, 0 40px 80px -30px rgba(15, 26, 22, .6); flex-shrink: 0; isolation: isolate; }
.app { position: absolute; inset: 0; overflow: hidden; background: var(--sand); }
@media (max-width: 520px) {
  .stage { padding: 0; display: block; }
  /* On a phone the frame is exactly the visible screen, so the dock always sits at its bottom. */
  .phone { position: fixed; inset: 0; width: auto; height: auto; border-radius: 0; box-shadow: none; }
  /* The viewer floats its own bar over the top of the page: start the app below it. */
  .app { top: 64px; }
  .dock { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- demo panel ---------- */
.demo { width: 320px; max-width: 100%; background: var(--paper); border-radius: 24px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 50px -30px rgba(15, 26, 22, .5); }
.demo h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.demo p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--ink-2); }
.demo h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.demo-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.demo-btn { border: 0; border-radius: 999px; padding: 8px 12px; background: var(--mist); font-size: 13px; font-weight: 600; }
.demo-btn[aria-pressed="true"] { background: var(--green); color: var(--mist); }
.demo-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.demo-fab { display: none; }
@media (max-width: 520px) {
  .demo { position: fixed; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 70dvh; overflow-y: auto; z-index: 100; }
  .demo[data-open="false"] { display: none; }
  .demo-fab { display: block; position: fixed; right: 0; top: 46%; z-index: 101; border: 0; border-radius: 10px 0 0 10px; padding: 10px 5px; background: rgba(30,53,45,.82); color: var(--mist); font-size: 11px; font-weight: 600; writing-mode: vertical-rl; letter-spacing: .06em; }
}

/* ---------- layout primitives ---------- */
.screen { position: absolute; inset: 0; background: var(--sand); display: flex; flex-direction: column; overflow: hidden; }
.screen.dark { background: var(--green); color: var(--mist); }
.scroll { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 0 20px 140px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch; }
.scroll.no-dock { padding-bottom: 120px; }
.scroll > * { flex-shrink: 0; }
.topbar { flex-shrink: 0; padding: 54px 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.topbar .title { font-size: 17px; font-weight: 600; }
.back { height: 44px; border: 0; background: transparent; display: flex; align-items: center; gap: 2px; font-size: 15px; font-weight: 500; padding: 0 12px 0 4px; border-radius: 999px; }
.icon-btn { width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--paper); display: grid; place-items: center; flex-shrink: 0; }
.icon-btn.dark { background: var(--green); }
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 4px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.grow { flex: 1 1 auto; min-width: 0; }
.act { position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; flex-direction: column; gap: 10px; z-index: 5; }
.act.above-dock { bottom: 102px; }
.act-note { text-align: center; font-size: 13px; color: var(--ink-3); }

/* ---------- type ---------- */
.display { font-family: var(--f-display); font-weight: 400; letter-spacing: -.01em; line-height: 1.02; margin: 0; }
.h1 { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; margin: 0; }
.h2 { font-size: 20px; font-weight: 600; letter-spacing: -.015em; margin: 0; }
.h3 { font-size: 16px; font-weight: 600; margin: 0; }
.body { font-size: 16px; line-height: 1.45; color: var(--ink-2); margin: 0; }
.small { font-size: 13px; line-height: 1.4; color: var(--ink-2); }
.tiny { font-size: 12px; line-height: 1.35; color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }
.code { font-weight: 600; letter-spacing: .06em; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

/* ---------- buttons ---------- */
.btn { height: 56px; border: 0; border-radius: 999px; padding: 0 22px; font-size: 17px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s ease, background .2s ease, opacity .2s ease; text-decoration: none; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--green); color: var(--mist); }
.btn.gold { background: var(--gold); color: var(--green); }
.btn.secondary { background: var(--paper); color: var(--green); }
.btn.ghost { background: transparent; color: var(--green); }
.btn.on-dark { background: rgba(233, 226, 216, .14); color: var(--mist); }
.btn.small { height: 40px; font-size: 14px; padding: 0 16px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { border: 0; background: none; padding: 6px; font-size: 14px; font-weight: 600; color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
.chip { height: 40px; border: 0; border-radius: 999px; padding: 0 14px; background: var(--mist); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0; transition: background .2s ease, color .2s ease, transform .12s ease; }
.chip:active { transform: scale(.97); }
.chip[aria-pressed="true"], .chip.on { background: var(--green); color: var(--mist); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scrollx { flex-wrap: nowrap; overflow-x: auto; margin: 0 -20px; padding: 0 20px; scrollbar-width: none; }

/* ---------- surfaces ---------- */
.card { background: var(--paper); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.focal { background: var(--green); color: var(--mist); box-shadow: 0 22px 40px -26px rgba(15, 26, 22, .8); }
.card.focal .small:not(.btn), .card.focal .tiny { color: #c9c1b4; }
.card.well { background: var(--mist); }
.card.tap { border: 0; text-align: left; transition: transform .12s ease; width: 100%; color: inherit; font: inherit; }
.card.tap:active { transform: scale(.985); }
.card.tap.focal { color: var(--mist); }
.card.selected { box-shadow: 0 0 0 2px var(--green); }
.photo { position: relative; overflow: hidden; border-radius: 24px; color: #fffdf9; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15, 26, 22, .05) 25%, rgba(15, 26, 22, .78) 100%); }
.photo .over { position: relative; height: 100%; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
.divider { height: 1px; background: var(--line); }
.avatar { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; font-size: 15px; font-weight: 600; flex-shrink: 0; background: var(--mist); }
.avatar.sm { width: 32px; height: 32px; font-size: 12px; }
.avatar.green { background: var(--green); color: var(--sand); }
.avatar.gold { background: var(--gold); color: var(--green); }
.stack { display: flex; }
.stack .avatar { border: 2px solid var(--sand); margin-left: -10px; }
.stack .avatar:first-child { margin-left: 0; }
.dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
.pill { height: 26px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; background: var(--mist); }
.pill.gold { background: var(--gold); color: var(--green); }
.pill.glass { background: rgba(15, 26, 22, .5); color: #fffdf9; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 253, 249, .18); }
.pill.ok { background: rgba(47, 122, 75, .12); color: var(--ok); }
.notice { border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; background: var(--paper); }
.notice.warn { background: #f3e6c9; }
.notice .grow { display: flex; flex-direction: column; gap: 4px; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input { height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--paper); padding: 0 16px; font-size: 17px; outline: none; box-sizing: border-box; width: 100%; }
.input:focus { border-color: var(--green); }
.input.bad { border-color: #a2402e; }
.field .err { font-size: 13px; color: #8a3524; line-height: 1.4; }
.otp { letter-spacing: .5em; text-align: center; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; height: 64px; }

/* ---------- dock ---------- */
.dock { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(255, 253, 249, .86); backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5); border: 1px solid rgba(30, 53, 45, .08); box-shadow: 0 18px 40px -18px rgba(30, 53, 45, .35); z-index: 20; }
.dock button { border: 0; background: transparent; width: 52px; height: 52px; border-radius: 999px; display: grid; place-items: center; transition: width .3s var(--ease), background .25s ease; color: var(--green); }
.dock button.on { width: auto; padding: 0 18px 0 14px; display: flex; gap: 8px; background: var(--green); color: var(--mist); font-size: 14px; font-weight: 600; }
.dock .orb { width: 60px; height: 60px; background: var(--green); }
.dock .badge { position: absolute; }

/* ---------- sheet ---------- */
.backdrop { position: absolute; inset: 0; background: rgba(15, 26, 22, .42); z-index: 40; animation: fade .25s ease both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; background: var(--paper); border-radius: 32px 32px 0 0; z-index: 41; display: flex; flex-direction: column; animation: sheetUp .45s var(--ease) both; }
.sheet .grab { align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #e3dcd1; margin: 10px 0 4px; flex-shrink: 0; }
.sheet .sheet-body { overflow-y: auto; padding: 8px 24px 28px; display: flex; flex-direction: column; gap: 16px; }

/* ---------- toast + banner ---------- */
.toast { position: absolute; left: 20px; right: 20px; bottom: 104px; z-index: 60; background: var(--green); color: var(--mist); border-radius: 18px; padding: 12px 16px; font-size: 14px; font-weight: 500; line-height: 1.4; display: flex; gap: 10px; align-items: center; animation: toastIn .4s var(--ease) both; box-shadow: 0 16px 30px -18px rgba(15, 26, 22, .7); }
.banner { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 70; background: rgba(255, 253, 249, .92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 22px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; box-shadow: 0 18px 40px -16px rgba(15, 26, 22, .5); animation: bannerIn .45s var(--ease) both; border: 0; text-align: left; width: calc(100% - 20px); }
.banner .app-ic { width: 36px; height: 36px; border-radius: 9px; background: var(--green); display: grid; place-items: center; flex-shrink: 0; }
.offline { flex-shrink: 0; background: var(--green); color: var(--mist); font-size: 13px; font-weight: 500; text-align: center; padding: 50px 16px 8px; }

/* ---------- slider ---------- */
.slider { position: relative; height: 64px; border-radius: 999px; background: var(--green); overflow: hidden; touch-action: none; user-select: none; border: 0; padding: 0; width: 100%; display: block; }
.slider .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--gold); }
.slider .label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-left: 44px; color: var(--mist); font-size: 17px; font-weight: 600; pointer-events: none; }
.slider .knob { position: absolute; top: 4px; width: 56px; height: 56px; border-radius: 999px; background: var(--gold); display: grid; place-items: center; box-shadow: 0 6px 16px -6px rgba(0, 0, 0, .5); pointer-events: none; }
.slider.busy .label { padding-left: 0; }

/* ---------- toggle ---------- */
.toggle { position: relative; width: 52px; height: 32px; border-radius: 999px; border: 0; padding: 0; background: rgba(30, 53, 45, .2); transition: background .25s ease; flex-shrink: 0; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 999px; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); transition: left .3s var(--spring); }
.toggle[aria-checked="true"] { background: var(--gold); }
.toggle[aria-checked="true"]::after { left: 23px; }
.toggle.on-dark { background: rgba(233, 226, 216, .24); }
.toggle.on-dark[aria-checked="true"] { background: var(--gold); }

/* ---------- flight card ---------- */
.route { display: flex; align-items: center; gap: 10px; }
.route .end { display: flex; flex-direction: column; }
.route .end.r { align-items: flex-end; }
.route .t { font-size: 24px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.route .c { font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--ink-3); }
.route .mid { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.route .line { width: 100%; display: flex; align-items: center; }
.route .line span { flex: 1 1 auto; border-top: 1.5px dashed rgba(30, 53, 45, .3); }
.cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cell { border-radius: 16px; background: var(--sand); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.cell .k { font-size: 12px; font-weight: 500; color: var(--ink-3); }
.cell .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- steps ---------- */
.steps { display: flex; flex-direction: column; gap: 14px; }
.step { display: flex; align-items: center; gap: 12px; font-size: 16px; }
.step .mark { width: 24px; height: 24px; display: grid; place-items: center; flex-shrink: 0; }
.step.todo { color: var(--ink-3); }
.spinner { width: 16px; height: 16px; border-radius: 999px; border: 2px solid #e3dcd1; border-top-color: var(--green); box-sizing: border-box; animation: spin 1s linear infinite; }
.spinner.light { border-color: rgba(233, 226, 216, .25); border-top-color: var(--mist); }

/* ---------- tracker ---------- */
.tracker { display: flex; flex-direction: column; gap: 0; }
.tracker .t-item { display: flex; gap: 12px; }
.tracker .rail { display: flex; flex-direction: column; align-items: center; width: 18px; }
.tracker .rail .node { width: 12px; height: 12px; border-radius: 999px; background: #d6cec2; margin-top: 4px; flex-shrink: 0; }
.tracker .rail .node.done { background: var(--ok); }
.tracker .rail .node.now { background: var(--gold); animation: glow 2.6s ease-in-out infinite; }
.tracker .rail .bar { width: 2px; flex: 1 1 auto; background: #e3dcd1; min-height: 20px; }
.tracker .t-text { padding-bottom: 14px; display: flex; flex-direction: column; gap: 2px; }

/* ---------- passport ---------- */
.passport { position: relative; height: 214px; border-radius: 22px; overflow: hidden; background: linear-gradient(150deg, var(--green-2) 0%, var(--green) 50%, var(--green-3) 100%); color: var(--sand); box-shadow: 0 28px 44px -26px rgba(15, 26, 22, .8); transition: transform .6s var(--ease); }
.passport .sheen { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255, 255, 255, 0) 30%, rgba(233, 210, 160, .3) 48%, rgba(170, 220, 210, .12) 54%, rgba(255, 255, 255, 0) 70%); background-size: 260% 100%; pointer-events: none; }
.passport .inner { position: relative; height: 100%; padding: 16px 18px 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
.passport .mrz { font-family: var(--f-mono); font-size: 10.5px; line-height: 1.45; color: rgba(233, 226, 216, .55); white-space: pre; overflow: hidden; }
.passport .photo-slot { width: 60px; height: 76px; border-radius: 12px; flex-shrink: 0; background: linear-gradient(160deg, var(--sand), #cfc4b2); display: grid; place-items: center; font-family: var(--f-display); font-size: 32px; color: var(--green); }

/* ---------- camera ---------- */
.camera { position: absolute; inset: 0; background: #0b100d; color: var(--mist); display: flex; flex-direction: column; }
.viewfinder { position: relative; margin: 0 24px; height: 230px; border-radius: 22px; border: 2px solid rgba(233, 226, 216, .5); overflow: hidden; }
.viewfinder .scanline { position: absolute; left: 0; right: 0; height: 2px; background: var(--gold); box-shadow: 0 0 18px var(--gold); animation: scan 1.6s ease-in-out infinite alternate; }

/* ---------- motion ---------- */
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes sheetUp { from { transform: translateY(100%) } to { transform: none } }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
@keyframes bannerIn { from { opacity: 0; transform: translateY(-24px) } to { opacity: 1; transform: none } }
@keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
@keyframes pushIn { from { transform: translateX(30%); opacity: .4 } to { transform: none; opacity: 1 } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(217, 183, 122, .6) } 50% { box-shadow: 0 0 0 6px rgba(217, 183, 122, 0) } }
@keyframes drift { 0% { transform: scale(1.06) } 50% { transform: scale(1.1) translate(-6px, -4px) } 100% { transform: scale(1.06) } }
@keyframes burst { 0% { transform: scale(.35); opacity: 0 } 25% { opacity: 1 } 100% { transform: scale(1.45); opacity: 0 } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0 } 60% { transform: scale(1.08); opacity: 1 } 100% { transform: scale(1) } }
@keyframes scan { from { top: 12% } to { top: 86% } }
@keyframes out { to { opacity: 0; transform: translateY(-14px) } }
@keyframes in { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
@keyframes flash { 0% { background: var(--paper) } 15% { background: #ecd9b0 } 100% { background: #f3ead8 } }
@keyframes rain { 0% { transform: translateY(-14px); opacity: 0 } 20% { opacity: .55 } 100% { transform: translateY(70px); opacity: 0 } }
.rise { animation: rise .5s var(--ease) both; }
.push { animation: pushIn .38s var(--ease) both; }
.breathe { animation: breathe 10s ease-in-out infinite; transform-origin: 50% 62%; }
.think { animation: breathe 1.6s ease-in-out infinite; transform-origin: 50% 62%; }
.drift { animation: drift 24s ease-in-out infinite; }
.pulse { animation: glow 2.6s ease-in-out infinite; }
.d1 { animation-delay: .06s } .d2 { animation-delay: .12s } .d3 { animation-delay: .18s } .d4 { animation-delay: .24s } .d5 { animation-delay: .3s }
@media (prefers-reduced-motion: reduce) { .welcome-video { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* typographic tabs */
.tabs-text { display: flex; gap: 18px; align-items: baseline; }
.tabs-text button { border: 0; background: none; padding: 0; font-size: 30px; font-weight: 600; letter-spacing: -.02em; color: #8a9590; transition: color .2s ease; }
.tabs-text button[aria-selected="true"] { color: var(--green); }
.city-switch { border: 0; background: none; padding: 0; font: inherit; color: var(--gold-ink); display: inline-flex; align-items: center; gap: 4px; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; text-decoration-color: rgba(185,143,74,.45); }
/* tip stories */
.story { color: #fffdf9; position: relative; border-radius: 28px; overflow: hidden; color: #fffdf9; min-height: 380px; display: flex; flex-direction: column; justify-content: flex-end; box-shadow: 0 24px 40px -30px rgba(15,26,22,.8); }
.story img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.story .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,26,22,.35) 0%, rgba(15,26,22,0) 28%, rgba(15,26,22,.15) 45%, rgba(15,26,22,.88) 100%); }
.story .top { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; }
.story .body { position: relative; padding: 18px; display: flex; flex-direction: column; gap: 10px; color: #fffdf9; font-size: 15px; line-height: 1.3; margin: 0; }
.story .quote { font-family: var(--f-display); font-size: 27px; line-height: 1.08; letter-spacing: -.005em; margin: 0; }
.story.plain { background: var(--green); min-height: 300px; }
.story.plain .veil { display: none; }
.glass-btn { height: 40px; border-radius: 999px; border: 1px solid rgba(255,253,249,.2); background: rgba(255,253,249,.14); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fffdf9; padding: 0 14px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.glass-btn.on { background: #d9b77a; color: #1e352d; border-color: transparent; }

/* ---------- with Faisal: waiting ---------- */
.wait { background: #0f1a16; color: #fffdf9; overflow: hidden; }
.wait-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: drift 18s ease-in-out infinite; }
.wait-veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,26,22,.55) 0%, rgba(15,26,22,.05) 24%, rgba(15,26,22,.2) 42%, rgba(15,26,22,.92) 66%, #0f1a16 100%); }
.wait-top { position: relative; z-index: 1; margin: 58px 16px 0; display: flex; justify-content: space-between; align-items: center; }
.wait-agent { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 999px; background: rgba(15,26,22,.5); border: 1px solid rgba(255,253,249,.16); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 13px; }
.wait-agent b { font-weight: 600; font-size: 14px; }
.wait-dot { position: absolute; right: -2px; bottom: -2px; width: 9px; height: 9px; border-radius: 99px; background: #4fbf7a; border: 2px solid #1e352d; animation: glow 2s ease-in-out infinite; }
.wait-live { color: rgba(255,253,249,.75); display: inline-flex; align-items: center; gap: 4px; animation: in .4s ease both; }
.dots { display: inline-flex; gap: 2px; }
.dots i { width: 3px; height: 3px; border-radius: 9px; background: currentColor; animation: dot 1.2s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s } .dots i:nth-child(3) { animation-delay: .3s }
@keyframes dot { 0%, 60%, 100% { opacity: .25; transform: none } 30% { opacity: 1; transform: translateY(-2px) } }
.wait-clock { font-size: 13px; padding: 8px 12px; border-radius: 999px; background: rgba(15,26,22,.5); border: 1px solid rgba(255,253,249,.16); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.wait-hero { position: relative; z-index: 1; margin-top: auto; padding: 0 24px 18px; display: flex; flex-direction: column; gap: 6px; }
.wait-sub { font-size: 15px; color: rgba(255,253,249,.82); }
.wait-panel { position: relative; z-index: 1; margin: 0 16px 34px; padding: 18px; border-radius: 26px; background: rgba(255,253,249,.08); border: 1px solid rgba(255,253,249,.12); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: flex; flex-direction: column; gap: 14px; }
.wait-row { display: flex; gap: 12px; align-items: flex-start; transition: opacity .4s; }
.wait-row.todo { opacity: .38; }
.wait-mark { width: 22px; height: 22px; flex: none; border-radius: 99px; border: 1.5px solid rgba(255,253,249,.35); display: grid; place-items: center; margin-top: 1px; transition: background .3s, border-color .3s; }
.wait-row.done .wait-mark { background: #d9b77a; border-color: #d9b77a; animation: pop .45s cubic-bezier(.2,.9,.25,1.2) both; }
.wait-row.now .wait-mark { border-color: #d9b77a; }
.wait-row.now .wait-mark i { width: 8px; height: 8px; border-radius: 9px; background: #d9b77a; animation: breathe 1.1s ease-in-out infinite; }
.wait-doing { font-size: 15px; font-weight: 600; }
.wait-row.now .wait-doing { background: linear-gradient(90deg, #fffdf9 30%, #d9b77a 50%, #fffdf9 70%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 1.8s linear infinite; }
@keyframes sheen { from { background-position: 100% 0 } to { background-position: -150% 0 } }
.wait-done { font-size: 13px; color: rgba(255,253,249,.7); }
.wait-q { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: rgba(15,26,22,.55); border: 1px solid rgba(217,183,122,.4); }
.wait-note { font-size: 12px; line-height: 1.35; color: rgba(255,253,249,.55); border-top: 1px solid rgba(255,253,249,.1); padding-top: 12px; }

/* ---------- passport intro ---------- */
.pp-stage { position: relative; height: 362px; border-radius: 32px; overflow: hidden; background: radial-gradient(120% 80% at 20% 0%, #2c4a40 0%, #1e352d 55%, #132620 100%); flex-shrink: 0; }
.pp-page { position: absolute; left: 22px; right: 22px; top: 22px; height: 178px; border-radius: 14px; background: #f4ecdd; color: #1e352d; overflow: hidden; transform: rotate(-2.5deg); box-shadow: 0 20px 36px -18px rgba(0,0,0,.6); padding: 12px 14px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; animation: in .7s var(--ease) both; }
.pp-guilloche { position: absolute; inset: 0; opacity: .5; background:
  repeating-radial-gradient(circle at 80% 120%, rgba(30,53,45,.07) 0 1px, transparent 1px 7px),
  repeating-radial-gradient(circle at 10% -30%, rgba(185,143,74,.1) 0 1px, transparent 1px 9px); }
.pp-head { position: relative; display: flex; justify-content: space-between; font-size: 9px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #7d5d27; }
.pp-main { position: relative; display: flex; gap: 12px; }
.pp-photo { width: 52px; height: 66px; border-radius: 8px; background: #e2d7c4; overflow: hidden; flex-shrink: 0; }
.pp-fields { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.pp-fields i, .pp-two i { display: block; font-style: normal; font-size: 8.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: #8a8173; }
.pp-two { display: flex; gap: 16px; }
.pp-mrz { position: relative; margin-top: auto; font-family: var(--f-mono); font-size: 8.6px; line-height: 1.4; color: #3f4f48; white-space: pre; overflow: hidden; }
.pp-beam { position: absolute; left: 0; right: 0; height: 2px; background: #d9b77a; box-shadow: 0 0 18px 6px rgba(217,183,122,.55); animation: scan 2.2s ease-in-out .4s infinite alternate; }
.pp-form { position: absolute; left: 14px; right: 14px; bottom: 12px; border-radius: 20px; background: rgba(255,253,249,.96); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -10px 30px -12px rgba(0,0,0,.45); animation: in .6s .5s var(--ease) both; }
.pp-form-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #1e352d; }
.pp-auto { margin-left: auto; font-size: 11px; font-weight: 600; color: #7d5d27; }
.pp-row { display: grid; grid-template-columns: 1fr auto 18px; align-items: center; gap: 8px; font-size: 12.5px; animation: in .5s var(--ease) both; }
.pp-k { color: #6b6a63; }
.pp-v { font-weight: 600; color: #1e352d; letter-spacing: .01em; }
.pp-tick { width: 18px; height: 18px; border-radius: 99px; background: #d9b77a; display: grid; place-items: center; }
.city-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px 8px 8px; border: 0; border-radius: 18px; background: var(--mist); text-align: left; color: var(--green); }
.city-row img { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
.city-row.on { background: #efe3c9; box-shadow: inset 0 0 0 1.5px #d9b77a; }
.address-card { border: 0; text-align: left; background: var(--mist); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 8px; color: var(--green); }
.address-big { position: absolute; inset: 0; z-index: 80; background: #fffdf9; padding: 80px 28px; display: flex; flex-direction: column; gap: 20px; justify-content: center; color: var(--green); animation: fade .2s ease both; }
.person-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 18px; background: var(--paper); text-align: left; color: var(--green); box-sizing: border-box; }
.person-row.on { background: #f3ead8; box-shadow: inset 0 0 0 1.5px #d9b77a; }
.tickbox { width: 24px; height: 24px; border-radius: 99px; border: 1.5px solid #c9c1b4; display: grid; place-items: center; flex-shrink: 0; }
.tickbox.on { background: var(--green); border-color: var(--green); }
.cover-pick { width: 64px; height: 64px; border-radius: 18px; border: 0; background-size: cover; background-position: center; padding: 0; box-shadow: inset 0 0 0 1px rgba(30,53,45,.1); }
.cover-pick.on { box-shadow: 0 0 0 3px var(--sand), 0 0 0 5px #b98f4a; }
.small-tabs button { font-size: 20px; }
.small-tabs sup { font-family: var(--f-sans, inherit); font-size: 11px; font-weight: 700; color: #7d5d27; margin-left: 3px; }
.new-tile { width: 120px; height: 128px; flex-shrink: 0; border-radius: 22px; border: 1.5px dashed #b98f4a; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--green); font-weight: 600; font-size: 14px; }
.badge-dot { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 99px; background: #b98f4a; border: 2px solid var(--sand); }
.friend-chip { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px; flex-shrink: 0; }
.going-dot { position: absolute; right: 1px; bottom: 1px; width: 14px; height: 14px; border-radius: 99px; background: #d9b77a; border: 2.5px solid var(--sand); }
.sheet .btn.secondary { background: var(--mist); }
.app:has(.offline) .banner { top: 46px; }

/* ---------- account management ---------- */
.acc-group { background: var(--paper); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; }
.acc-group.well { background: var(--mist); flex-shrink: 0; }
.acc-group > * + *, .acc-group > .acc-faq + .acc-faq { border-top: 1px solid var(--line); }
.acc-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 56px; box-sizing: border-box; width: 100%; border: 0; background: transparent; text-align: left; color: var(--green); font: inherit; transition: background .15s ease; }
button.acc-row:active { background: rgba(30, 53, 45, .05); }
.acc-row.col { align-items: stretch; }
.acc-k { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .01em; }
.acc-v { font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--green); }
.acc-break { word-break: break-all; }
.acc-ic { width: 36px; height: 36px; border-radius: 12px; background: var(--mist); display: grid; place-items: center; flex-shrink: 0; }
.acc-ic.on { background: var(--green); }
.acc-ic.big { width: 52px; height: 52px; border-radius: 18px; background: #f3e6c9; }
.acc-src { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; line-height: 1.3; color: var(--ink-3); margin-top: 2px; }
.acc-src.ok { color: var(--ok); }
.acc-src.warn { color: var(--gold-ink); }
.acc-intro { padding: 0 4px; text-align: center; }
.acc-warn { color: var(--gold-ink); }
.acc-err { text-align: center; color: #8a3524; font-size: 13px; }

/* profile header and photo */
.acc-head { gap: 16px; padding-top: 4px; }
.acc-avatar-wrap { position: relative; border: 0; background: none; padding: 0; display: inline-flex; flex-shrink: 0; border-radius: 999px; }
.acc-avatar-wrap .avatar { box-shadow: 0 14px 28px -16px rgba(15, 26, 22, .7); }
.acc-cam { position: absolute; right: -2px; bottom: -2px; width: 26px; height: 26px; border-radius: 999px; background: var(--gold); display: grid; place-items: center; border: 3px solid var(--sand); }
.acc-photo { object-fit: cover; padding: 0; display: block; }
.acc-namebtn { border: 0; background: none; padding: 0; text-align: left; color: var(--green); gap: 2px; align-items: flex-start; }
.acc-link { display: inline-flex; align-items: center; gap: 2px; margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--gold-ink); }
.acc-hero { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 0 0; align-self: center; }
.acc-hero .acc-cam { width: 30px; height: 30px; }
.acc-file { position: relative; cursor: pointer; box-sizing: border-box; overflow: hidden; }

/* crop */
.acc-crop { position: relative; align-self: center; border-radius: 28px; overflow: hidden; background: #0f1a16; touch-action: none; cursor: grab; flex-shrink: 0; }
.acc-crop:active { cursor: grabbing; }
.acc-crop img { position: absolute; max-width: none; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.acc-crop-ring { position: absolute; inset: 0; border-radius: 999px; box-shadow: 0 0 0 200px rgba(15, 26, 22, .5), inset 0 0 0 2px rgba(255, 253, 249, .85); pointer-events: none; }
.acc-range { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px; background: #e3dcd1; outline: none; }
.acc-range::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 999px; background: var(--green); border: 3px solid var(--paper); box-shadow: 0 2px 8px rgba(15, 26, 22, .3); cursor: pointer; }
.acc-range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 999px; background: var(--green); border: 3px solid var(--paper); }

/* status pills */
.acc-pill.ok { background: rgba(47, 122, 75, .12); color: var(--ok); }
.acc-pill.gold { background: #f3e6c9; color: var(--gold-ink); }
.acc-pill.warn { background: #f4ddd5; color: #8a3524; }
.acc-pill.muted { background: var(--mist); color: var(--ink-2); }
.acc-pp { gap: 8px; }
.acc-pp.gold, .acc-pp.warn { box-shadow: inset 0 0 0 1.5px #e6cf9f; }

/* phone swap */
.acc-swap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: 20px; background: var(--mist); }

/* small inline buttons inside rows */
.btn.small.acc-mini { height: 34px; padding: 0 12px; font-size: 13px; background: var(--mist); color: #8a3524; flex-shrink: 0; }

/* notes */
.acc-notes { height: 96px; padding: 12px 14px; font-size: 15px; line-height: 1.4; resize: none; }

/* faq */
.acc-faq { display: flex; flex-direction: column; }
.acc-answer { margin: -4px 0 0; padding: 0 16px 16px; animation: in .3s var(--ease) both; }
.acc-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

/* Sign out: two clear choices, the destructive one in red */
.acc-choice { align-items: flex-start; text-align: left; gap: 6px; width: 100%; }
.acc-choice .small { color: var(--ink-2); padding-left: 46px; }
/* Empty states for a new account */
.wl-empty { border: 1.5px dashed rgba(30, 53, 45, .18); background: transparent; }
.ob-empty { align-items: flex-start; gap: 10px; }

/* ---------- search ---------- */
.search-summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; border: 0; border-radius: 18px; background: var(--paper); text-align: left; color: var(--green); }
.seg { display: flex; padding: 4px; border-radius: 999px; background: var(--mist); gap: 4px; }
.seg button { flex: 1; height: 38px; border: 0; border-radius: 999px; background: transparent; font-weight: 600; font-size: 14px; color: #5d6a64; }
.seg button[aria-checked="true"] { background: var(--paper); color: var(--green); box-shadow: 0 2px 8px -4px rgba(15,26,22,.35); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px 0; }
.cal-h { text-align: center; font-size: 11px; font-weight: 600; color: #8a9590; padding-bottom: 4px; }
.cal-d { height: 38px; border: 0; background: transparent; font-size: 14px; font-weight: 500; color: var(--green); font-variant-numeric: tabular-nums; }
.cal-d.in { background: #f3ead8; }
.cal-d.end { background: var(--green); color: #f6f2ec; border-radius: 999px; font-weight: 700; }
.cal-d:disabled { color: #b9c0bc; text-decoration: line-through; text-decoration-color: rgba(30,53,45,.18); }
.cal-d.today { box-shadow: inset 0 0 0 1.5px rgba(30,53,45,.25); border-radius: 999px; }
.cal-d.flex:not(.in) { background: #f8f1e3; }
.cal-head { gap: 8px; }
.cal-head .icon-btn { width: 36px; height: 36px; background: var(--mist); }
.cal-head .icon-btn:disabled { opacity: .35; }
.cal-months { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 2px 4px; }
.cal-months::-webkit-scrollbar { display: none; }
.cal-months button { flex-shrink: 0; height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--mist); font-size: 13px; font-weight: 600; color: #4d5c55; }
.cal-months button[aria-pressed="true"] { background: var(--green); color: var(--mist); }
.cal-quick .chip { height: 34px; font-size: 13px; }

/* ---------- ask screen ---------- */
.ask-scroll { padding-bottom: 150px; }
.ask-bubble { align-self: flex-end; max-width: 78%; background: #1e352d; color: #f6f2ec; padding: 12px 16px; border-radius: 22px 22px 6px 22px; font-size: 16px; line-height: 1.4; }
/* The composer and the main button sit on their own band, so results never show through them. */
.ask-act { left: 0; right: 0; bottom: 0; padding: 28px 20px 24px; background: linear-gradient(to bottom, rgba(233,226,216,0), var(--sand) 26px); gap: 6px; }
.ask-composer { height: 56px; border-radius: 999px; background: #fffdf9; border: 1px solid var(--line); padding: 0 6px 0 20px; box-shadow: 0 10px 30px -18px rgba(30,53,45,.4); }
.ask-composer input { flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; }
.sr-only-ask { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ask.is-offline .topbar { padding-top: 64px; }
.sort-tab { border: 0; background: none; padding: 4px 0; font-size: 14px; font-weight: 600; color: #7a857f; border-bottom: 2px solid transparent; }
.sort-tab[aria-pressed="true"] { color: #1e352d; border-bottom-color: #d9b77a; }
.flight-opt { border: 0; background: none; text-align: left; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; width: 100%; }
.chip-add { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(30,53,45,.25); }

/* ---------- requests ---------- */
.need-card { gap: 8px; padding: 14px; }
.need-card .chip { height: 34px; font-size: 13px; padding: 0 12px; }
.chip.hint { box-shadow: inset 0 0 0 1.5px var(--gold-deep); }
.req-note { height: auto; min-height: 84px; padding: 12px 16px; font-size: 15px; line-height: 1.4; resize: none; font-family: inherit; }
.quote-table { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--mist); }
.quote-person { display: flex; flex-direction: column; gap: 3px; }
.quote-total { padding-top: 8px; border-top: 1px solid var(--line); font-size: 15px; font-weight: 700; color: #1e352d; }
.req-thread { display: flex; flex-direction: column; gap: 8px; }
.req-msg { display: flex; gap: 8px; align-items: flex-start; max-width: 88%; font-size: 14px; line-height: 1.45; }
.req-msg > .col { padding: 9px 13px; border-radius: 18px; }
.req-msg.them > .col, .req-msg.them > .dots { background: #fffdf9; color: #1e352d; border-radius: 6px 18px 18px 18px; padding: 9px 13px; }
.req-msg.me { align-self: flex-end; }
.req-msg.me > .col { background: #1e352d; color: #f6f2ec; border-radius: 18px 6px 18px 18px; }
.req-msg.me .tiny { color: rgba(246,242,236,.75); }
.req-reply { display: flex; align-items: center; gap: 6px; height: 46px; border-radius: 999px; background: #fffdf9; border: 1px solid var(--line); padding: 0 4px 0 16px; }
.req-reply input { flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; }
.req-reply .icon-btn { width: 38px; height: 38px; }
.req-reply .icon-btn:disabled { opacity: .4; }
.search-sheet { display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
.search-sheet > * { flex-shrink: 0; }
.search-sheet .seg button { height: 34px; }
.search-sheet .cal-d { height: 36px; }
.need-card .chip { background: var(--paper); }
.need-card .chip[aria-pressed="true"] { background: var(--green); }
.req-quote { font-size: 13px; line-height: 1.45; color: #1e352d; padding-left: 10px; border-left: 2px solid var(--gold); font-style: italic; }
.req-needs { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.4; color: var(--ink-2); }
.ask .card.well .chip:not([aria-pressed="true"]):not(.chip-add) { background: var(--paper); }

/* ---------- Circles: list tiles, empty states, the circle chat and its tools ---------- */

/* Text on photos sits on a veil, dark enough to read at any point of the image. */
.cx-veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,26,22,.28) 0%, rgba(15,26,22,.08) 30%, rgba(15,26,22,.45) 58%, rgba(15,26,22,.86) 100%); }

/* list */
.cx-tile { width: 210px; height: 128px; border: 0; padding: 0; flex-shrink: 0; }
.cx-tile.plain { width: 176px; padding: 14px 16px; justify-content: space-between; box-sizing: border-box; align-items: flex-start; overflow: hidden; text-align: left; }
.cx-line { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; max-width: 100%; word-break: break-word; }
.cx-tile.plain .cx-line { -webkit-line-clamp: 2; }

/* empty states */
.cx-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 22px 20px 20px; border-radius: 26px; background: var(--paper); box-shadow: inset 0 0 0 1px rgba(185,143,74,.14); }
.cx-empty .small { max-width: 290px; }
.cx-empty .btn { margin-top: 6px; }
.cx-empty-hero { padding: 28px 22px 24px; gap: 10px; background: radial-gradient(120% 90% at 50% 0%, #fbf3e4 0%, var(--paper) 60%); }
.cx-empty-hero .display { color: var(--green); }
.cx-empty.row-empty { flex-direction: row; align-items: center; text-align: left; gap: 14px; padding: 16px; }
.cx-empty.row-empty .cx-art { flex-shrink: 0; width: 72px; height: auto; }
.cx-empty.row-empty .btn { margin-top: 0; }
.cx-art { display: block; }

/* the empty passport: a real page, waiting for its first stamp */
.cx-passport { position: relative; border-radius: 22px; padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 6px; color: var(--green); overflow: hidden;
  background:
    repeating-radial-gradient(circle at 110% -20%, rgba(185,143,74,.10) 0 1px, transparent 1px 9px),
    repeating-radial-gradient(circle at -10% 120%, rgba(30,53,45,.06) 0 1px, transparent 1px 7px),
    linear-gradient(180deg, #fbf6ec, #f4ecdc);
  box-shadow: inset 0 0 0 1px rgba(185,143,74,.22), 0 18px 30px -26px rgba(15,26,22,.6); }
.cx-passport::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed rgba(185,143,74,.25); pointer-events: none; }
.cx-watermark { position: absolute; right: -18px; bottom: -14px; pointer-events: none; }
.cx-passport-head { display: flex; justify-content: space-between; align-items: center; }
.cx-stamp-row { display: flex; gap: 14px; padding: 10px 0 12px; position: relative; z-index: 1; }
.cx-stamp { width: 76px; height: 76px; border-radius: 999px; display: grid; place-items: center; flex-shrink: 0; box-sizing: border-box; }
.cx-stamp.ghost { border: 1.5px dashed rgba(185,143,74,.38); }
.cx-stamp.soon { border: 2px dashed #b98f4a; color: #7d5d27; background: rgba(255,253,249,.6); }
.cx-stamp.soon > span { width: 62px; height: 62px; border-radius: 999px; border: 1px dashed #b98f4a; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.cx-stamp b { font-family: var(--f-display); font-weight: 400; font-size: 15px; }
.cx-stamp i { font-style: normal; font-size: 9px; font-weight: 600; letter-spacing: .08em; }
.cx-passport > .h3, .cx-passport > .small, .cx-passport > .btn { position: relative; z-index: 1; }

/* header: a photo with a veil, or plain; one line under the name */
.cx-head { position: relative; flex-shrink: 0; padding-bottom: 12px; }
.cx-head.photo-head { color: #fffdf9; background: #0f1a16; }
.cx-head-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cx-head-veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,26,22,.55) 0%, rgba(15,26,22,.25) 40%, rgba(15,26,22,.82) 100%); }
.cx-head-text { position: relative; padding: 0 24px; display: flex; flex-direction: column; gap: 4px; }
.cx-head-text .display { font-size: 34px; }
.cx-head-sub { font-size: 13px; color: var(--ink-3); }
.photo-head .cx-head-sub { color: rgba(255,253,249,.88); }
.photo-head .topbar .back { color: #fffdf9 !important; }
.cx-faces { border: 0; background: none; padding: 4px; display: flex; align-items: center; gap: 4px; border-radius: 999px; }
.cx-faces.on-photo { background: rgba(15,26,22,.42); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,253,249,.18); padding: 3px 8px 3px 3px; color: #fffdf9; }
.cx-faces .stack .avatar { margin-left: -8px; }
.cx-faces .stack .avatar:first-child { margin-left: 0; }
.cx-more { font-size: 12px; font-weight: 600; padding-left: 2px; }

/* the one pinned line */
.cx-pin { flex-shrink: 0; display: flex; align-items: center; gap: 12px; margin: 10px 16px 2px; padding: 10px 14px; border: 0; border-radius: 18px; background: var(--paper); color: var(--green); text-align: left; box-shadow: 0 10px 24px -20px rgba(15,26,22,.6); }
.cx-pin-ic { width: 32px; height: 32px; border-radius: 999px; background: #f3ead8; color: #7d5d27; display: grid; place-items: center; flex-shrink: 0; }
.cx-pin-k { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--gold-ink); }
.cx-pin-t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* thread */
.cx-thread { padding-top: 14px; padding-bottom: 104px; gap: 10px; }
.cx-row { display: flex; align-items: flex-start; gap: 8px; }
.cx-row.cont { margin-top: -6px; }
.cx-row.mine { flex-direction: row-reverse; }
.cx-face { width: 32px; flex-shrink: 0; display: flex; }
.cx-bubble { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px; border-radius: 6px 22px 22px 22px; background: var(--paper); color: var(--green); font-size: 15px; line-height: 1.45; max-width: 80%; box-sizing: border-box; overflow-wrap: anywhere; }
.cx-row.cont .cx-bubble { border-radius: 22px; }
.cx-row.mine .cx-bubble { background: var(--green); color: var(--mist); border-radius: 22px 6px 22px 22px; }
.cx-bubble.mada { background: #fbf6ec; box-shadow: inset 0 0 0 1px rgba(185,143,74,.2); }
.cx-row .cx-bubble.bare, .cx-row.mine .cx-bubble.bare { background: none; padding: 0; max-width: calc(100% - 40px); width: 100%; box-shadow: none; border-radius: 0; color: var(--green); }
.cx-row.wide.mine { padding-left: 40px; }
.cx-row.wide.mine .cx-bubble.bare { max-width: 100%; }
.cx-name { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.cx-row.mine .cx-bubble.bare .cx-name { text-align: right; }
.cx-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cx-bubble .btn.secondary { background: var(--mist); }
.cx-bubble.mada .btn.secondary { background: #fffdf9; box-shadow: inset 0 0 0 1px rgba(30,53,45,.08); }
.cx-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.cx-list li::marker { color: #b98f4a; font-weight: 700; }
.cx-ok { color: var(--ok) !important; font-weight: 600; }
.cx-sys { align-self: center; max-width: 86%; text-align: center; font-size: 12px; color: var(--ink-3); background: rgba(255,253,249,.55); border-radius: 999px; padding: 5px 12px; }
.cx-seen { align-self: flex-end; font-size: 12px; color: var(--ink-3); margin-top: -4px; padding-right: 4px; }
.cx-typing { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); padding-left: 40px; }
.cx-typing .dots { display: inline-flex; gap: 3px; background: var(--paper); border-radius: 999px; padding: 7px 9px; }
.cx-typing .dots i { width: 5px; height: 5px; border-radius: 99px; background: var(--ink-3); animation: dot 1.2s infinite; }
.cx-typing .dots i:nth-child(2) { animation-delay: .15s; }
.cx-typing .dots i:nth-child(3) { animation-delay: .3s; }

/* cards in the thread */
.cx-card { background: var(--paper); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 14px 28px -26px rgba(15,26,22,.7); }
.cx-opt { position: relative; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--mist); overflow: hidden; padding: 0; text-align: left; color: var(--green); }
.cx-opt.on { border: 2px solid var(--green); }
.cx-opt.won { border: 2px solid #b98f4a; }
.cx-opt[disabled] { cursor: default; }
.cx-fill { position: absolute; left: 0; top: 0; bottom: 0; background: #ece3d4; transition: width .5s var(--ease); }
.cx-opt.on .cx-fill, .cx-opt.won .cx-fill { background: #ecd9b0; }
.cx-opt-row { position: relative; height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px 0 14px; font-size: 14px; font-weight: 600; }
.cx-opt-l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cx-voters .avatar { margin-left: -7px; border-width: 1.5px !important; }
.cx-voters .avatar:first-child { margin-left: 0; }
.cx-n { min-width: 14px; text-align: right; }
.cx-vote.closed .cx-opt:not(.won) { opacity: .7; }

.cx-amt { font-size: 17px; font-weight: 700; white-space: nowrap; }
.cx-shares { display: flex; flex-direction: column; gap: 2px; }
.cx-shares.well { background: var(--mist); border-radius: 18px; padding: 6px 12px; }
.cx-share { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.cx-share:last-child { border-bottom: 0; }
.cx-share .stack .avatar { margin-left: -9px; }
.cx-share .stack .avatar:first-child { margin-left: 0; }
.cx-share-l { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cx-share-a { font-size: 14px; font-weight: 600; white-space: nowrap; }
.cx-share.paid .cx-share-a { color: var(--ink-3); text-decoration: line-through; text-decoration-color: rgba(30,53,45,.3); }
.cx-mark { font-size: 12px; padding: 2px 0; }
.cx-share-l.wrap { white-space: normal; line-height: 1.25; }
.cx-split.settled { background: linear-gradient(180deg, #f2f7f2, var(--paper)); }
.cx-amt-in { width: 96px; height: 40px; border-radius: 12px; text-align: right; font-size: 15px; padding: 0 10px; flex-shrink: 0; }
.cx-sar { width: 64px; flex-shrink: 0; display: grid; place-items: center; font-size: 14px; font-weight: 600; color: var(--ink-2); padding: 0; }
.cx-seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--mist); border-radius: 14px; padding: 4px; gap: 4px; }
.cx-seg button { height: 38px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.cx-seg button[aria-checked="true"] { background: var(--paper); color: var(--green); box-shadow: 0 2px 6px rgba(15,26,22,.1); }
.cx-chip-ghost { background: transparent; box-shadow: inset 0 0 0 1px rgba(185,143,74,.45); color: #7d5d27; height: 34px; font-size: 13px; }

.cx-share-card { padding: 8px 8px 12px; }
.cx-share-card > .small, .cx-share-card > .cx-actions, .cx-share-card > .col { padding: 0 6px; }
.cx-share-photo { position: relative; display: block; height: 150px; border-radius: 16px; overflow: hidden; border: 0; padding: 0; width: 100%; color: #fffdf9; text-align: left; }
.cx-share-photo.small { height: 112px; }
.cx-share-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cx-share-over { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.cx-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #3f4f48; }

/* the circle's trip */
.cx-trip { border-radius: 24px; overflow: hidden; background: var(--paper); flex-shrink: 0; box-shadow: 0 18px 30px -26px rgba(15,26,22,.7); }
.cx-trip-photo { position: relative; height: 128px; color: #fffdf9; }
.cx-trip-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; }
.cx-trip-over { position: absolute; left: 0; right: 0; bottom: 0; top: 0; padding: 12px 16px 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; }
.cx-trip-over .display { margin-top: auto; }
.cx-trip-rows { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }

/* composer */
.cx-composer { position: absolute; left: 16px; right: 16px; bottom: 22px; z-index: 5; display: flex; align-items: center; gap: 6px; height: 54px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); padding: 0 6px; box-shadow: 0 16px 30px -22px rgba(15,26,22,.6); }
.cx-composer input { flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; padding: 0 6px; }
.cx-composer input:first-child, .cx-composer label + input { padding-left: 14px; }
.cx-plus { width: 40px; height: 40px; border-radius: 999px; border: 0; background: #f3ead8; color: #7d5d27; display: grid; place-items: center; flex-shrink: 0; }
.cx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.cx-tool { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border: 0; border-radius: 18px; background: var(--mist); text-align: left; color: var(--green); }
.cx-tool[disabled] { opacity: .5; }
.cx-tool-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--paper); display: grid; place-items: center; flex-shrink: 0; color: var(--green); }

/* invited people in circle settings */
.cx-invited { align-items: flex-start; background: var(--mist); }
.cx-faded { opacity: .55; }
.cx-mini { height: 32px !important; font-size: 13px !important; padding: 0 12px !important; }

/* ---------- new circle: two calm steps ---------- */
.nc-scroll { gap: 18px; padding-bottom: 150px !important; }
.nc-act { background: linear-gradient(180deg, rgba(233,226,216,0) 0%, var(--sand) 34%); padding-top: 28px; }
.nc-preview { position: relative; height: 200px; border-radius: 28px; background: #1e352d center/cover; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; flex-shrink: 0; box-shadow: 0 22px 40px -28px rgba(15,26,22,.8); transition: background-image .3s ease; }
.nc-veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,26,22,.05) 30%, rgba(15,26,22,.78) 100%); }
.nc-preview-name { position: relative; font-family: var(--f-display); font-size: 36px; line-height: 1; color: #fffdf9; overflow-wrap: anywhere; }
.nc-preview-sub { position: relative; font-size: 13px; color: rgba(255,253,249,.82); margin-top: 6px; }
.nc-covers { gap: 12px; justify-content: center; }
.cover-dot { width: 44px; height: 44px; border-radius: 999px; border: 0; background-size: cover; background-position: center; padding: 0; box-shadow: inset 0 0 0 1px rgba(30,53,45,.1); transition: transform .2s ease; }
.cover-dot.on { box-shadow: 0 0 0 3px var(--sand), 0 0 0 5px #b98f4a; transform: scale(1.06); }
.nc-ideas { font-size: 14px; color: #7a857f; }
.nc-ideas .link { font-size: 14px; }
.nc-picked { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; }
.nc-chosen { position: relative; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 56px; flex-shrink: 0; animation: pop .35s cubic-bezier(.2,.9,.25,1.2) both; }
.nc-chosen i { position: absolute; top: -2px; right: 2px; width: 18px; height: 18px; border-radius: 99px; background: #1e352d; color: #f6f2ec; font-style: normal; font-size: 12px; line-height: 18px; text-align: center; }
.nc-link { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-size: 14px; }

/* ---------- disruption ---------- */
.dz.is-offline .topbar { padding-top: 64px; }
.dz-pad { padding: 24px 24px 0; display: flex; flex-direction: column; gap: 18px; }
.dz-scroll { padding-bottom: 130px; }
.dz-call { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--paper); color: var(--green); font-size: 14px; font-weight: 600; text-decoration: none; }
.dz-call.dark { background: var(--green); color: var(--mist); }
.dz-radio { width: 22px; height: 22px; border-radius: 999px; border: 2px solid #1e352d; display: grid; place-items: center; flex-shrink: 0; margin-top: 2px; box-sizing: border-box; }
.dz-radio span { width: 10px; height: 10px; border-radius: 999px; }
.dz-tick { width: 64px; height: 64px; border-radius: 999px; background: #2f7a4b; display: grid; place-items: center; animation: pop .6s var(--spring) both; }
.dz-wait { width: 56px; height: 56px; border-radius: 999px; background: var(--paper); display: grid; place-items: center; }
.dz-tonight { gap: 12px; }
.dz-ic { width: 34px; height: 34px; border-radius: 12px; background: var(--paper); display: grid; place-items: center; flex-shrink: 0; }
.dz-rights { gap: 6px; }
.dz-rights ul { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.dz-rights b { color: var(--green); font-weight: 600; }
.dz-callrow { gap: 8px; text-decoration: none; }
.dz-act { left: 0; right: 0; bottom: 0; padding: 22px 20px 28px; background: linear-gradient(to bottom, rgba(233,226,216,0), var(--sand) 22px); }
/* The global offline bar is about 38px tall; drop banners below it on these screens. */
.app:has(.dz.is-offline) .banner, .app:has(.ask.is-offline) .banner, .app:has(.support.is-offline) .banner { top: 46px; }

/* ---------- empty states ---------- */
.empty-hero { display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 28px; background: var(--paper); box-shadow: 0 18px 36px -28px rgba(15,26,22,.5); }
.empty-hero .display { font-size: 32px; line-height: 1.02; }
.idea-row { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.idea { flex: 0 0 124px; height: 150px; border-radius: 20px; border: 0; padding: 0; position: relative; overflow: hidden; text-align: left; }
.idea img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
.idea:active img { transform: scale(1.06); }
.idea::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,26,22,0) 40%, rgba(15,26,22,.85) 100%); }
.idea span { position: absolute; left: 12px; right: 10px; bottom: 10px; z-index: 1; color: #fffdf9; font-weight: 600; font-size: 14px; line-height: 1.2; }
.idea small { display: block; font-weight: 500; font-size: 11px; color: rgba(255,253,249,.8); }

.board { background: #121c18; border-radius: 22px; padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 20px 34px -24px rgba(0,0,0,.7); }
.board-head { display: flex; justify-content: space-between; align-items: center; color: #d9b77a; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; padding: 0 2px 4px; }
.board-dot { width: 7px; height: 7px; border-radius: 9px; background: #4fbf7a; animation: glow 1.6s ease-in-out infinite; }
.board-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; border: 0; background: none; padding: 0; text-align: left; }
.board-flaps { display: flex; gap: 2px; }
.board-flaps i { font-style: normal; width: 17px; height: 24px; display: grid; place-items: center; background: linear-gradient(180deg, #24312c 0 49%, #1c2723 51% 100%); color: #f4ead6; font-family: var(--f-mono); font-size: 13px; font-weight: 600; border-radius: 3px; animation: flap .5s cubic-bezier(.3,.7,.3,1) both; }
.board-flaps i.blink { color: #d9b77a; animation: flap .5s both, blinkish 2.4s 1s ease-in-out infinite; }
.board-code, .board-dur { font-family: var(--f-mono); font-size: 11px; color: #9bb0a6; letter-spacing: .06em; }
.board-you .board-dur { color: #d9b77a; }
@keyframes flap { 0% { transform: rotateX(90deg); opacity: .2 } 60% { transform: rotateX(-14deg); opacity: 1 } 100% { transform: none } }
@keyframes blinkish { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }

.pp-empty { position: relative; height: 210px; border-radius: 18px; background: repeating-linear-gradient(0deg, rgba(185,143,74,.07) 0 1px, transparent 1px 22px), radial-gradient(140% 100% at 0% 0%, #fbf3e3 0%, #f1e5cc 100%); box-shadow: inset 0 0 0 1px rgba(125,93,39,.15); overflow: hidden; }
.pp-empty::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(125,93,39,.18); box-shadow: -2px 0 8px rgba(125,93,39,.08); }
.pp-empty-title { position: absolute; top: 10px; left: 14px; font-size: 9px; letter-spacing: .2em; color: #b98f4a; font-weight: 700; }
.pp-empty-no { position: absolute; bottom: 10px; right: 14px; font-family: var(--f-mono); font-size: 10px; color: #b98f4a; }
.pp-slot { position: absolute; width: 74px; height: 74px; margin: -6px; border-radius: 999px; border: 2px dashed rgba(125,93,39,.3); background: transparent; display: grid; place-items: center; transition: transform .35s var(--spring, cubic-bezier(.2,.9,.25,1.2)); }
.pp-slot.first { border-color: #b98f4a; color: #7d5d27; font-family: var(--f-display); font-size: 14px; line-height: 1; animation: wobble 3.2s ease-in-out infinite; }
.pp-slot.hit { transform: scale(1.15) rotate(0deg) !important; border-style: solid; }
@keyframes wobble { 0%, 100% { transform: rotate(-12deg) } 50% { transform: rotate(-4deg) scale(1.04) } }

.plane-loop { display: block; }

.radar { position: relative; width: 150px; height: 150px; margin: 6px auto; display: grid; place-items: center; }
.radar-ring { position: absolute; border-radius: 999px; border: 1px solid rgba(185,143,74,.35); }
.radar-ring.r1 { inset: 0; } .radar-ring.r2 { inset: 25px; } .radar-ring.r3 { inset: 50px; }
.radar-sweep { position: absolute; inset: 0; border-radius: 999px; background: conic-gradient(from 0deg, rgba(217,183,122,.45), rgba(217,183,122,0) 70deg, transparent 360deg); animation: spin 3.2s linear infinite; }
.radar-blip { position: absolute; top: 28px; right: 34px; width: 7px; height: 7px; border-radius: 9px; background: #4fbf7a; animation: blinkish 3.2s ease-in-out infinite; }

/* ---------- the empty-state family: one wrapper, one stage, one motion language ---------- */
.es { display: flex; flex-direction: column; gap: 12px; padding: 14px 14px 18px; border-radius: 28px; background: var(--paper); box-shadow: 0 18px 36px -28px rgba(15,26,22,.5); }
.es.plain { background: transparent; box-shadow: none; padding: 4px 0 0; }
.es > .es-title, .es > .es-body, .es > .btn, .es > .es-ideas, .es > .es-extra { margin-left: 4px; margin-right: 4px; }
.es-title { font-size: 30px; line-height: 1.04; margin: 4px 0 0; font-weight: 400; }
.es-body { margin: -4px 0 2px; color: var(--ink-2); max-width: 38ch; }
.es.center { align-items: center; text-align: center; }
.es.center .es-body { margin-left: auto; margin-right: auto; }
.es.center > .btn { align-self: center; }
.es > .btn { align-self: flex-start; }
.es > .btn.block { align-self: stretch; }
.es-stage { position: relative; height: 132px; border-radius: 20px; overflow: hidden; display: grid; place-items: center;
  background: radial-gradient(120% 90% at 50% 0%, #fbf6ec 0%, #f3ebdd 100%); box-shadow: inset 0 0 0 1px rgba(125,93,39,.1); }
.es-stage::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(125,93,39,.13) 1px, transparent 1.2px); background-size: 14px 14px; mask-image: radial-gradient(70% 80% at 50% 50%, #000 30%, transparent 100%); -webkit-mask-image: radial-gradient(70% 80% at 50% 50%, #000 30%, transparent 100%); }
.es-stage .es-svg { position: relative; width: 176px; height: 132px; }
.es-ideas { display: flex; gap: 8px; overflow-x: auto; flex-wrap: nowrap; margin: 0 -14px !important; padding: 0 18px 2px; scrollbar-width: none; }
.es-ideas::-webkit-scrollbar { display: none; }
.es-ideas .chip { flex-shrink: 0; }
.es.center .es-ideas { justify-content: safe center; }

/* the compact version, for a slot inside a list */
.es-row { display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 12px; border-radius: 22px; background: var(--paper); border: 0; text-align: left; width: 100%; box-sizing: border-box; color: inherit; font: inherit; }
.es-row.plain { background: transparent; padding: 10px 2px; border-radius: 0; }
.es-row.tap { cursor: pointer; transition: transform .18s var(--ease); }
.es-row.tap:active { transform: scale(.985); }
.es-tile { flex: 0 0 80px; width: 80px; height: 64px; border-radius: 16px; display: grid; place-items: center; overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, #fbf6ec 0%, #f1e8d8 100%); box-shadow: inset 0 0 0 1px rgba(125,93,39,.1); }
.es-tile .es-svg { width: 100px; height: 75px; flex-shrink: 0; }
.es-row-body { color: var(--ink-2); }
.es-row-act { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.es-row-act .link { padding: 2px 0; }

/* motion: every piece settles to a still picture when Reduce Motion is on (base state = final state) */
.es-svg * { transform-box: fill-box; }
.es-draw { stroke-dasharray: 100; stroke-dashoffset: 0; animation: es-draw 1.4s .2s var(--ease) both; }
@keyframes es-draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
.es-map .es-draw { animation: es-draw 2.2s .3s var(--ease) both, es-redraw 9s 2.5s ease-in-out infinite; }
@keyframes es-redraw { 0%, 70% { stroke-dashoffset: 0 } 78% { stroke-dashoffset: 100 } 100% { stroke-dashoffset: 0 } }
.es-bob { transform-origin: 50% 100%; animation: es-bob 2.6s ease-in-out infinite; }
.es-shadow { transform-origin: center; animation: es-shadow 2.6s ease-in-out infinite; }
@keyframes es-bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
@keyframes es-shadow { 0%, 100% { transform: scaleX(1); opacity: .15 } 50% { transform: scaleX(.7); opacity: .08 } }
.es-swing { transform-origin: 0% 0%; animation: es-swing 3.4s ease-in-out infinite; }
@keyframes es-swing { 0%, 100% { transform: rotate(-5deg) } 50% { transform: rotate(6deg) } }
.es-rise-card { animation: es-rise-card 5s ease-in-out infinite; }
@keyframes es-rise-card { 0%, 100% { transform: translateY(6px) } 45%, 60% { transform: translateY(-4px) } }
.es-shine { animation: es-shine 5s ease-in-out infinite; }
@keyframes es-shine { 0%, 40% { transform: skewX(-18deg) translateX(0) } 75%, 100% { transform: skewX(-18deg) translateX(120px) } }
.es-glide { animation: es-glide 4.5s ease-in-out infinite; }
@keyframes es-glide { 0% { transform: translateX(-8px); opacity: 0 } 20% { opacity: 1 } 80% { opacity: 1 } 100% { transform: translateX(26px); opacity: 0 } }
.es-pop { transform-origin: center; animation: es-pop .5s var(--spring) both; }
@keyframes es-pop { from { transform: scale(0) } to { transform: scale(1) } }
.es-ring { transform-origin: center; animation: es-turn 14s linear infinite; }
@keyframes es-turn { to { transform: rotate(360deg) } }
.es-pulse { transform-origin: center; animation: es-pulse 3.2s ease-in-out infinite; }
@keyframes es-pulse { 0%, 100% { transform: scale(.85); opacity: .28 } 50% { transform: scale(1.1); opacity: .1 } }
.es-drop { animation: es-drop 1.1s .3s var(--spring) both, es-sway-r 4s 1.6s ease-in-out infinite; transform-origin: 50% 0%; }
@keyframes es-drop { from { transform: translateY(-46px) } to { transform: translateY(0) } }
@keyframes es-sway-r { 0%, 100% { transform: rotate(0) } 50% { transform: rotate(3deg) } }
.es-page { transform-origin: 50% 0%; animation: es-page 6s 1s ease-in-out infinite; }
@keyframes es-page { 0%, 55% { transform: none; opacity: 1 } 70% { transform: scaleY(.15) skewX(-10deg); opacity: .9 } 72% { opacity: 0 } 92% { opacity: 0; transform: none } 100% { opacity: 1 } }
.es-print { animation: es-print 6s ease-in-out infinite; }
@keyframes es-print { 0% { transform: translateY(-40px); opacity: 1 } 7% { transform: translateY(-30px) } 14% { transform: translateY(-20px) } 21% { transform: translateY(-10px) } 28%, 88% { transform: translateY(0); opacity: 1 } 94% { transform: translateY(6px); opacity: 0 } 95% { transform: translateY(-40px); opacity: 0 } 100% { transform: translateY(-40px); opacity: 1 } }
.es-blink { animation: blinkish 1.2s ease-in-out infinite; }
.es-stamp { animation: es-stamp .55s .6s var(--spring) both; transform-origin: center; }
@keyframes es-stamp { from { opacity: 0; transform: rotate(-12deg) scale(1.6) } to { opacity: 1; transform: rotate(-12deg) scale(1) } }
.es-breathe { transform-origin: 40% 60%; animation: es-breathe 4s ease-in-out infinite; }
@keyframes es-breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.035) } }
.es-dot { animation: es-dot 1.5s ease-in-out infinite; }
.es-dot.d2 { animation-delay: .2s } .es-dot.d3 { animation-delay: .4s }
@keyframes es-dot { 0%, 60%, 100% { opacity: .25; transform: translateY(0) } 30% { opacity: 1; transform: translateY(-2px) } }
.es-float { animation: es-float 4s 1s ease-in-out infinite; }
@keyframes es-float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
.es-needle { transform-origin: 50% 50%; animation: es-needle 7s ease-out infinite; }
@keyframes es-needle { 0% { transform: rotate(-60deg) } 12% { transform: rotate(32deg) } 22% { transform: rotate(-16deg) } 31% { transform: rotate(8deg) } 40% { transform: rotate(-3deg) } 48%, 100% { transform: rotate(0) } }
.es-swing-l { transform-origin: 50% 0%; animation: es-swing-l 4.6s ease-in-out infinite; }
@keyframes es-swing-l { 0%, 100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
.es-glow { transform-origin: center; animation: es-glow 3s ease-in-out infinite; }
@keyframes es-glow { 0%, 100% { opacity: .75; transform: scale(.95) } 50% { opacity: 1; transform: scale(1.06) } }
.es-flame { transform-origin: 50% 100%; animation: es-flame 1.8s ease-in-out infinite; }
@keyframes es-flame { 0%, 100% { transform: scale(1) } 50% { transform: scale(.88, 1.08) } }
.es-lift { animation: es-lift 4.4s ease-in-out infinite; }
@keyframes es-lift { 0%, 100% { transform: translateY(14px) } 45%, 65% { transform: translateY(0) } }

/* the four from before, brought into the family */
.es-stage .plane-loop { position: relative; width: 100%; height: 120px; }
.es-stage .radar { margin: 0; width: 116px; height: 116px; }
.es-stage .radar-ring.r2 { inset: 20px; } .es-stage .radar-ring.r3 { inset: 40px; }

/* Wallet: a passport that isn't there yet gets a photo slot and a slow scan line */
.passport.waiting .inner { position: relative; }
.pp-wait { display: flex; gap: 14px; align-items: center; }
.pp-wait-photo { flex: 0 0 58px; height: 72px; border-radius: 10px; border: 1.5px dashed rgba(217,183,122,.55); display: grid; place-items: center; position: relative; overflow: hidden; }
.pp-wait-photo::after { content: ''; position: absolute; left: 4px; right: 4px; height: 2px; top: 10px; border-radius: 2px; background: #d9b77a; box-shadow: 0 0 12px 2px rgba(217,183,122,.6); animation: pp-scan 2.8s ease-in-out infinite; }
@keyframes pp-scan { 0%, 100% { top: 10px } 50% { top: calc(100% - 12px) } }
.pp-wait-mrz { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; color: rgba(233,226,216,.28); white-space: nowrap; overflow: hidden; }
.credit-card.zero { position: relative; overflow: hidden; }
.credit-card.zero::after { content: ''; position: absolute; top: 0; bottom: 0; width: 60px; left: -80px; background: linear-gradient(90deg, transparent, rgba(217,183,122,.16), transparent); transform: skewX(-18deg); animation: cc-sheen 6s 1s ease-in-out infinite; pointer-events: none; }
@keyframes cc-sheen { 0%, 60% { left: -80px } 100% { left: 110% } }

/* Account: a face that isn't there yet */
.acc-avatar-wrap.empty::before { content: ''; position: absolute; inset: -6px; border-radius: 999px; border: 1.5px dashed rgba(185,143,74,.6); animation: es-turn 24s linear infinite; }

/* Chat that hasn't started: the drawing sits at the top of the thread */
.es-chat-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 8px 12px 4px; }
.es-chat-hero .es-stage { width: 100%; max-width: 300px; height: 116px; background: transparent; box-shadow: none; }
.es-chat-hero .es-stage::before { display: none; }
.es-chat-hero .display { font-size: 28px; line-height: 1.05; }
.es-chat-hero .small { max-width: 30ch; }
.es-chat-hero .es-ideas { margin: 6px 0 0 !important; padding: 0; justify-content: safe center; max-width: 100%; }

/* Support on first open: topics as a tidy grid, never a pile of pills */
.sp-topics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sp-topics button { border: 0; border-radius: 16px; background: var(--paper); padding: 12px; text-align: left; font-size: 14px; font-weight: 600; color: var(--green); display: flex; align-items: center; gap: 10px; min-height: 48px; }
.sp-topics button svg { flex-shrink: 0; color: var(--gold-deep); }

/* Household and other short lists: the drawing sits under the list */
.es-under { margin-top: 2px; }
.es-ring-a { animation: es-ring-a 6s ease-in-out infinite; }
.es-ring-b { animation: es-ring-b 6s ease-in-out infinite; }
.es-ring-c { animation: es-ring-c 6s ease-in-out infinite; }
@keyframes es-ring-a { 0%, 100% { transform: translateX(0) } 50% { transform: translateX(-6px) } }
@keyframes es-ring-b { 0%, 100% { transform: translateX(0) } 50% { transform: translateX(6px) } }
@keyframes es-ring-c { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
.cx-stamp.ghost.first { border-color: rgba(185,143,74,.55); animation: cx-wob 3.6s ease-in-out infinite; }
@keyframes cx-wob { 0%, 100% { transform: rotate(-7deg) } 50% { transform: rotate(-2deg) scale(1.05) } }
.acc-group > .es-row.plain { padding: 14px 16px 14px 12px; }
.es-row.well { background: var(--mist); }

/* Today: the small pieces on the nothing-planned screen */
.td-mini-art { display: block; width: 66px; height: 50px; margin: -6px 0 0 -8px; }
.td-mini-art .es-svg { width: 66px; height: 50px; }
.td-pp-mini { flex: 0 0 28px; width: 28px; height: 36px; border-radius: 5px; background: #1e352d; position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(217,183,122,.35); }
.td-pp-mini::before { content: ''; position: absolute; left: 7px; top: 8px; width: 14px; height: 14px; border-radius: 99px; border: 1.5px solid #d9b77a; }
.td-pp-mini i { position: absolute; left: 3px; right: 3px; height: 1.5px; top: 4px; background: #f3d79c; box-shadow: 0 0 6px 1px rgba(217,183,122,.7); animation: td-pp-scan 2.6s ease-in-out infinite; }
@keyframes td-pp-scan { 0%, 100% { top: 4px } 50% { top: 30px } }

/* A screen that is only its empty state: a taller stage, centred in the space under the header */
.es.center .es-stage { align-self: stretch; }
.es.tall .es-stage { height: 208px; border-radius: 22px; }
.es.tall .es-stage .es-svg { width: 256px; height: 192px; }
.es.tall .es-title { font-size: 34px; }
.es.tall .es-stage .radar { width: 160px; height: 160px; }
.es.tall .es-stage .radar-ring.r2 { inset: 28px; } .es.tall .es-stage .radar-ring.r3 { inset: 56px; }
.es.tall .es-stage .plane-loop { height: 170px; }
.es.middle { margin-top: auto; margin-bottom: auto; }

/* ---------- payments ---------- */
.faceid { width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; color: #1e352d; background: var(--mist); animation: breathe 1.4s ease-in-out infinite; }
.faceid.ok { animation: pop .4s cubic-bezier(.2,.9,.25,1.2) both; background: #e3f0e7; }
.faceid.bad { animation: none; color: #8a3524; background: #f6e3de; }
.chip svg { margin-right: 6px; vertical-align: -3px; }
.credit-card { border: 0; text-align: left; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 6px; color: #f6f2ec; background: radial-gradient(120% 120% at 100% 0%, #2c4a40 0%, #1e352d 55%, #142720 100%); box-shadow: 0 22px 40px -26px rgba(15,26,22,.8); }

/* ---------- support and inbox ---------- */
.support-head { display: flex; align-items: center; gap: 12px; padding: 0 24px 8px; }
